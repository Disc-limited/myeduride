<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MyEduRide Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #064e3b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #10b981 0%, #0284c7 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
    }
    .logo-container svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .retry-btn {
      display: none;
      background: #10b981;
      color: #04100c;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:active {
      transform: scale(0.96);
    }
    .status-text {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
      </svg>
    </div>
    <h1>MyEduRide</h1>
    <p>Student Transit & Gate Security Platform</p>
    
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="status">Connecting to secure server...</div>
    <button class="retry-btn" id="retryBtn" onclick="window.location.reload()">Retry Connection</button>
  </div>

  <script>
    // If Capacitor configuration hasn't redirected yet or network is reconnecting
    setTimeout(function() {
      var spinner = document.getElementById('spinner');
      var retry = document.getElementById('retryBtn');
      var status = document.getElementById('status');
      if (spinner && retry && status) {
        status.textContent = 'Server is taking longer than usual to respond.';
        retry.style.display = 'inline-block';
      }
    }, 6000);
  </script>
</body>
</html>
